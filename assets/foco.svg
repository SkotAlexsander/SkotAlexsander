  <text x="862.0" y="166.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#E6EEF9" text-anchor="end" font-weight="700">15%</text>
  <text x="32.0" y="210.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#98A7C0">3D &amp; motion</text>
