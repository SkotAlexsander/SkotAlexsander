<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 248" width="900" height="248" role="img" aria-label="Distribuição de foco por área">
  <title>Distribuição de foco por área</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090F"/>
      <stop offset="100%" stop-color="#0C0D16"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.2" fill="#000" opacity=".20"/>
    </pattern>
  </defs>
  <rect width="900" height="248" rx="10" fill="url(#fundo)"/>
  <text x="32.0" y="44.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5C6A85" letter-spacing="3">% DO TEMPO DE TRABALHO</text>
  <text x="32.0" y="78.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#98A7C0">Desenvolvimento web</text>
