<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-label="Distribuição de foco por área">
  <title>Distribuição de foco por área</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090F"/>
      <stop offset="100%" stop-color="#0C0D16"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.2" fill="#000" opacity=".20"/>
    </pattern>
  </defs>
  <rect width="940" height="302" rx="10" fill="url(#fundo)"/>
  <text x="32.0" y="44.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#5C6A85" letter-spacing="3">% DO TEMPO DE TRABALHO</text>
  <text x="32.0" y="94.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#98A7C0">Desenvolvimento web</text>
  <rect x="295" y="74" width="525" height="26" rx="4" fill="#1B2338" opacity=".55"/>
  <rect x="295" y="74" width="288.5" height="26" rx="4" fill="#00a0ac"/>
  <text x="900.0" y="94.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#E6EEF9" text-anchor="end" font-weight="700">55%</text>
  <text x="32.0" y="148.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#98A7C0">Edição de vídeo</text>
  <rect x="295" y="128" width="525" height="26" rx="4" fill="#1B2338" opacity=".55"/>
  <rect x="295" y="128" width="104.9" height="26" rx="4" fill="#c08a00"/>
  <text x="900.0" y="148.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#E6EEF9" text-anchor="end" font-weight="700">20%</text>
  <text x="32.0" y="202.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#98A7C0">IA &amp; automação</text>
  <rect x="295" y="182" width="525" height="26" rx="4" fill="#1B2338" opacity=".55"/>
  <rect x="295" y="182" width="78.7" height="26" rx="4" fill="#f51f8f"/>
  <text x="900.0" y="202.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#E6EEF9" text-anchor="end" font-weight="700">15%</text>
  <text x="32.0" y="256.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#98A7C0">3D &amp; motion</text>
  <rect x="295" y="236" width="525" height="26" rx="4" fill="#1B2338" opacity=".55"/>
  <rect x="295" y="236" width="52.5" height="26" rx="4" fill="#b350ff"/>
  <text x="900.0" y="256.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#E6EEF9" text-anchor="end" font-weight="700">10%</text>
  <rect width="940" height="302" rx="10" fill="url(#scan)"/>
  <rect x="1" y="1" width="938" height="300" rx="10" fill="none" stroke="#1B2338" stroke-width="2"/>
</svg>
