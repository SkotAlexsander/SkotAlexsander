  <rect x="248" y="194" width="54.4" height="21" rx="4" fill="#b350ff"/>
  <text x="862.0" y="210.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#E6EEF9" text-anchor="end" font-weight="700">10%</text>
  <rect width="900" height="248" rx="10" fill="url(#scan)"/>
  <rect x="1" y="1" width="898" height="246" rx="10" fill="none" stroke="#1B2338" stroke-width="2"/>
