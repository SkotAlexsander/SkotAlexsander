<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Alex Martins — sites e vídeo, feitos pela mesma pessoa">
  <title>Alex Martins — sites e vídeo, feitos pela mesma pessoa</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#06070E"/>
      <stop offset="55%"  stop-color="#0A0917"/>
      <stop offset="100%" stop-color="#11061B"/>
    </linearGradient>

    <radialGradient id="glowC" cx="20%" cy="28%" r="58%">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowM" cx="84%" cy="78%" r="58%">
      <stop offset="0%"   stop-color="#FF2E97" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#FF2E97" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#00F0FF" stop-opacity=".9"/>
      <stop offset="52%"  stop-color="#B14EFF" stop-opacity=".9"/>
      <stop offset="84%"  stop-color="#FF2E97" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9BF7FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#9BF7FF" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#9BF7FF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.2" fill="#000" opacity=".30"/>
    </pattern>

    <filter id="blurLg" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blurSm" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <clipPath id="frame"><rect x="0" y="0" width="1200" height="340" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- fundo -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#glowC)"/>
    <rect width="1200" height="340" fill="url(#glowM)"/>

    <!-- horizonte em perspectiva -->
    <g stroke="#00F0FF" stroke-width="1" opacity=".22">
      <path d="M600 256 L-360 340M600 256 L-160 340M600 256 L40 340M600 256 L220 340M600 256 L380 340M600 256 L520 340M600 256 L600 340M600 256 L680 340M600 256 L820 340M600 256 L980 340M600 256 L1160 340M600 256 L1360 340M600 256 L1560 340"/>
    </g>
    <g stroke="#B14EFF" stroke-width="1" opacity=".20">
      <path d="M0 262H1200M0 272H1200M0 286H1200M0 306H1200M0 332H1200"/>
    </g>
    <rect x="0" y="252" width="1200" height="2" fill="#00F0FF" opacity=".55"/>
    <rect x="0" y="248" width="1200" height="10" fill="#00F0FF" opacity=".18" filter="url(#blurSm)"/>

    <!-- etiqueta superior -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="4">
      <text x="72" y="58" fill="#4BE3F2" opacity=".85">&#160;//&#160;NOTAS DE TRABALHO</text>
      <text x="1128" y="58" fill="#FF6FB5" opacity=".70" text-anchor="end">BRASIL&#160;&#183;&#160;pt-BR</text>
    </g>

    <!-- nome: aberracao cromatica -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="82" font-weight="700" letter-spacing="9" text-anchor="middle">

      <text x="600" y="168" fill="#00F0FF" opacity=".45" filter="url(#blurLg)">ALEX MARTINS</text>

      <g style="mix-blend-mode:screen">
        <text x="600" y="168" fill="#FF2E97" opacity=".85" transform="translate(-3,0)">ALEX MARTINS
          <animateTransform attributeName="transform" type="translate"
            values="-3,0; -3,0; -11,3; -3,0; -3,0; 5,-2; -3,0; -3,0"
            keyTimes="0;0.40;0.425;0.45;0.80;0.825;0.85;1"
            dur="7s" repeatCount="indefinite"/>
        </text>
        <text x="600" y="168" fill="#00F0FF" opacity=".85" transform="translate(3,0)">ALEX MARTINS
          <animateTransform attributeName="transform" type="translate"
            values="3,0; 3,0; 10,-3; 3,0; 3,0; -6,2; 3,0; 3,0"
            keyTimes="0;0.40;0.425;0.45;0.80;0.825;0.85;1"
            dur="7s" repeatCount="indefinite"/>
        </text>
      </g>

      <text x="600" y="168" fill="#EEF4FF">ALEX MARTINS</text>
    </g>

    <!-- regua neon -->
    <rect x="190" y="192" width="820" height="2" fill="url(#rule)"/>

    <!-- subtitulo -->
    <text x="600" y="228" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="26" letter-spacing="5" fill="#A9BDDE">
      DESENVOLVIMENTO WEB&#160;&#160;&#183;&#160;&#160;EDI&#199;&#195;O DE V&#205;DEO
    </text>

    <!-- linha de comando -->
    <rect x="336" y="281" width="528" height="36" rx="18" fill="#04050B" opacity=".72"/>
    <rect x="336" y="281" width="528" height="36" rx="18" fill="none" stroke="#5EE9C4" stroke-width="1" opacity=".28"/>
    <text x="600" y="306" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="20" letter-spacing="1" fill="#5EE9C4" opacity=".92">
      &#62; dois of&#237;cios, os mesmos dois materiais_
      <animate attributeName="opacity" values=".92;.55;.92" dur="3.2s" repeatCount="indefinite"/>
    </text>

    <!-- cantos HUD -->
    <g stroke="#00F0FF" stroke-width="2" fill="none" opacity=".7">
      <path d="M28 62V28h34M1172 62V28h-34M28 278v34h34M1172 278v34h-34"/>
    </g>

    <!-- varredura CRT -->
    <rect x="0" y="-60" width="1200" height="60" fill="url(#sweep)">
      <animate attributeName="y" values="-60;340" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- scanlines -->
    <rect width="1200" height="340" fill="url(#scan)"/>

    <!-- moldura -->
    <rect x="1" y="1" width="1198" height="338" rx="10" fill="none" stroke="#1E2A4A" stroke-width="2"/>
  </g>
</svg>
