<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-label="Trajetória">
  <title>Trajetória</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090F"/>
      <stop offset="100%" stop-color="#0C0D16"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.2" fill="#000" opacity=".20"/>
    </pattern>
  </defs>
  <rect width="760" height="424" rx="10" fill="url(#fundo)"/>
  <rect x="53" y="56" width="2" height="268" fill="#1B2338" opacity="1"/>
  <rect x="53" y="56" width="2" height="268" fill="#00a0ac" opacity=".30"/>
  <text x="94.0" y="46.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#00a0ac" letter-spacing="3">O COMEÇO</text>
  <text x="94.0" y="78.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#E6EEF9" font-weight="700">Primeiros projetos</text>
  <text x="94.0" y="112.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#98A7C0">Aprender fazendo: quebrar,</text>
  <text x="94.0" y="140.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#98A7C0">consertar, refazer melhor.</text>
  <circle cx="54" cy="56" r="14" fill="#08090F"/>
  <circle cx="54" cy="56" r="9.5" fill="none" stroke="#00a0ac" stroke-width="2.5"/>
  <circle cx="54" cy="56" r="3.5" fill="#00a0ac"/>
  <text x="94.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#b350ff" letter-spacing="3">A VIRADA</text>
  <text x="94.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#E6EEF9" font-weight="700">As áreas se cruzam</text>
  <text x="94.0" y="246.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#98A7C0">Percebo que código e edição</text>
  <text x="94.0" y="274.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#98A7C0">resolvem o mesmo problema.</text>
  <circle cx="54" cy="190" r="14" fill="#08090F"/>
  <circle cx="54" cy="190" r="9.5" fill="none" stroke="#b350ff" stroke-width="2.5"/>
  <circle cx="54" cy="190" r="3.5" fill="#b350ff"/>
  <text x="94.0" y="314.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#c08a00" letter-spacing="3">HOJE</text>
  <text x="94.0" y="346.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#E6EEF9" font-weight="700">As duas frentes</text>
  <text x="94.0" y="380.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#98A7C0">Uma fortalece a outra, com</text>
  <text x="94.0" y="408.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#98A7C0">IA no meio do fluxo.</text>
  <circle cx="54" cy="324" r="14" fill="#08090F"/>
  <circle cx="54" cy="324" r="9.5" fill="none" stroke="#c08a00" stroke-width="2.5"/>
  <circle cx="54" cy="324" r="3.5" fill="#c08a00"/>
  <rect width="760" height="424" rx="10" fill="url(#scan)"/>
  <rect x="1" y="1" width="758" height="422" rx="10" fill="none" stroke="#1B2338" stroke-width="2"/>
</svg>
